name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  version-gate:
    name: "Version gate (Node ${{ matrix.node-version }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 24]
        include:
          - node-version: 20
            experimental: false
          - node-version: 24
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install JS deps
        run: npm ci

      - name: Verify manifest version consistency (fail-fast)
        run: npm run version:check

      - name: "Node ${{ matrix.node-version }} compat: build + test"
        if: matrix.node-version != 20
        run: |
          echo "::notice::Node ${{ matrix.node-version }} compatibility check (experimental)"
          npm run build:selftest
          npm test

  smoke-desktop-editor:
    name: Desktop smoke test (Tauri self-test)
    needs: version-gate
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust (cargo + target)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install JS deps
        run: npm ci

      - name: Build frontend (selftest mode)
        run: npm run build:selftest

      - name: Force selftest rebuild (embed fresh dist/)
        run: touch src-tauri/src/bin/selftest.rs

      - name: Build selftest binary
        env:
          TAURI_CONFIG: '{"build":{"devUrl":null,"frontendDist":"../dist"},"productName":"Lazy Editor Selftest","identifier":"com.lazy-editor.selftest"}'
        run: cd src-tauri && cargo build --bin lazy-editor-selftest

      - name: "Self-test: editor-basic"
        timeout-minutes: 2
        env:
          RUST_BACKTRACE: "1"
        run: src-tauri/target/debug/lazy-editor-selftest --workspace "$GITHUB_WORKSPACE" --self-test editor-basic

      - name: "Self-test: editor-undo-redo"
        timeout-minutes: 2
        env:
          RUST_BACKTRACE: "1"
        run: src-tauri/target/debug/lazy-editor-selftest --workspace "$GITHUB_WORKSPACE" --self-test editor-undo-redo

      - name: "Self-test: editor-formatting"
        timeout-minutes: 2
        env:
          RUST_BACKTRACE: "1"
        run: src-tauri/target/debug/lazy-editor-selftest --workspace "$GITHUB_WORKSPACE" --self-test editor-formatting

  ci-stability-baseline:
    name: CI stability baseline summary (non-blocking)
    needs: version-gate
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Restore diagnose history cache
        uses: actions/cache@v4
        with:
          path: .artifacts/test-diagnose/history.json
          key: ci-test-diagnose-history-${{ github.ref_name }}
          restore-keys: |
            ci-test-diagnose-history-main
            ci-test-diagnose-history-

      - name: Generate baseline summary from diagnose history
        run: node scripts/ci-stability-baseline.mjs

      - name: Publish workflow summary
        if: always()
        run: cat .artifacts/test-diagnose/ci-baseline/stability-baseline.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload baseline artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-stability-baseline-${{ github.run_id }}
          path: .artifacts/test-diagnose/ci-baseline/*
          if-no-files-found: warn

  lint:
    name: Lint (Biome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JS deps
        run: npm ci

      - name: Biome lint
        run: npm run lint

  frontend-test:
    name: Frontend tests (Node 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JS deps
        run: npm ci

      - name: Vitest
        run: npm test

  rust-test:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config
          # Rust's default Linux linker (rust-lld) does not search GCC's
          # private library directory, where the unversioned libstdc++.so
          # symlink lives. fastembed/ONNX Runtime links -lstdc++.
          libstdcpp="$(g++ -print-file-name=libstdc++.so)"
          sudo ln -sfn "$libstdcpp" /usr/lib/x86_64-linux-gnu/libstdc++.so

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-
            ${{ runner.os }}-cargo-

      - name: cargo test
        working-directory: src-tauri
        env:
          RUST_BACKTRACE: "1"
        run: cargo test
